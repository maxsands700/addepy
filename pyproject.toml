[build-system]
requires = ["setuptools>=61.0,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "addepy"
dynamic = ["version"]
description = "Unofficial Python SDK for the Addepar API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Max Sands", email = "maxsands700@email.com"}
]
keywords = ["addepar", "api", "sdk", "finance", "wealth-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dataframe = ["pandas>=2.0.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.9", "build>=1.2"]

[tool.setuptools.dynamic]
version = {attr = "addepy._version.__version__"}

[tool.setuptools.packages.find]
include = ["addepy*"]

[tool.setuptools.package-data]
addepy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["live: requires explicit --live and Addepar credentials"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["F"]

[project.urls]
Homepage = "https://github.com/maxsands700/addepy"
Repository = "https://github.com/maxsands700/addepy"
