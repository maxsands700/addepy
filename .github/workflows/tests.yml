name: Offline SDK checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,dataframe]'
      - run: python -m pytest --junitxml=test-results/offline.xml
      - run: ruff check addepy tests
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-results-${{ matrix.python-version }}
          path: test-results/
